[project]
name = "multi-agent-orchestrator"
version = "0.1.0"
description = "A reusable multi-agent system using Google ADK and MCP tool use"
requires-python = ">=3.11"
dependencies = [
    "google-adk[extensions]>=2.5.0",
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    "pydantic>=2.13.4",
    "click>=8.4.2",
    "pyyaml>=6.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "rich>=14.3.4",
]

[project.scripts]
orchestrator = "cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "orchestrator", "config", "models"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
